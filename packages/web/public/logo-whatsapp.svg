<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f8f8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a039"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="640" fill="url(#bg)" rx="64"/>

  <!-- Subtle radial light behind tree -->
  <circle cx="320" cy="260" r="180" fill="#d4a039" opacity="0.04"/>
  <circle cx="320" cy="260" r="120" fill="#d4a039" opacity="0.06"/>

  <!-- Tree trunk -->
  <line x1="320" y1="360" x2="320" y2="440" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>

  <!-- Tree canopy -->
  <path d="M320 160 Q265 220 275 310 Q285 345 320 355 Q355 345 365 310 Q375 220 320 160Z"
        fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Person sitting under tree -->
  <!-- Body -->
  <circle cx="295" cy="420" r="12" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Torso leaning on tree -->
  <path d="M295 432 Q292 450 298 465" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M298 465 L310 470 L320 465" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Book -->
  <rect x="302" y="445" width="18" height="13" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2.5" transform="rotate(-10 311 451)"/>
  <line x1="311" y1="443" x2="311" y2="457" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(-10 311 451)"/>

  <!-- Light source (apple/inspiration moment) -->
  <circle cx="320" cy="130" r="18" fill="#d4a039" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="320" cy="130" r="10" fill="#e8c547" opacity="0.9"/>

  <!-- Light rays -->
  <line x1="320" y1="105" x2="320" y2="92" stroke="#d4a039" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="300" y1="115" x2="290" y2="105" stroke="#d4a039" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="340" y1="115" x2="350" y2="105" stroke="#d4a039" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="295" y1="130" x2="282" y2="128" stroke="#d4a039" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="345" y1="130" x2="358" y2="128" stroke="#d4a039" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Falling light trail (inspiration descending) -->
  <path d="M320 148 L308 380" stroke="#d4a039" stroke-width="1.5" opacity="0.15" stroke-dasharray="6 6"/>

  <!-- Brand text -->
  <text x="320" y="540" text-anchor="middle" font-family="'Georgia', serif" font-size="62" font-weight="700" fill="#1a1a1a" letter-spacing="-1">
    <tspan>Lux</tspan><tspan fill="#d4a039">view</tspan>
  </text>

  <!-- Tagline -->
  <text x="320" y="580" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="20" fill="#1a1a1a" opacity="0.5" letter-spacing="3">
    EXPERIENCIAS UNICAS
  </text>
</svg>
