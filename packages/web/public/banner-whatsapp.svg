<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#d4a039"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="softGlowBanner">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- Subtle geometric decoration - left side -->
  <circle cx="80" cy="300" r="200" fill="none" stroke="#d4a039" stroke-width="0.5" opacity="0.06"/>
  <circle cx="80" cy="300" r="280" fill="none" stroke="#d4a039" stroke-width="0.3" opacity="0.04"/>
  <circle cx="80" cy="300" r="360" fill="none" stroke="#d4a039" stroke-width="0.3" opacity="0.02"/>

  <!-- Subtle geometric decoration - right side -->
  <circle cx="1120" cy="300" r="200" fill="none" stroke="#d4a039" stroke-width="0.5" opacity="0.06"/>
  <circle cx="1120" cy="300" r="280" fill="none" stroke="#d4a039" stroke-width="0.3" opacity="0.04"/>

  <!-- Ambient light glow in center -->
  <ellipse cx="600" cy="200" rx="180" ry="130" fill="#d4a039" opacity="0.03"/>
  <ellipse cx="600" cy="200" rx="90" ry="70" fill="#d4a039" opacity="0.04"/>

  <!-- Tree icon (centered) -->
  <!-- Trunk -->
  <line x1="600" y1="260" x2="600" y2="320" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- Canopy -->
  <path d="M600 130 Q560 175 567 240 Q574 260 600 268 Q626 260 633 240 Q640 175 600 130Z"
        fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Person -->
  <circle cx="580" cy="310" r="8" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M580 318 Q578 330 582 340" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M582 340 L592 343 L598 340" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Book -->
  <rect x="588" y="328" width="13" height="9" rx="1.5" fill="none" stroke="#1a1a1a" stroke-width="2" transform="rotate(-8 594 332)"/>

  <!-- Light source -->
  <circle cx="600" cy="105" r="14" fill="#d4a039" opacity="0.6" filter="url(#softGlowBanner)"/>
  <circle cx="600" cy="105" r="8" fill="#e8c547" opacity="0.9"/>

  <!-- Light rays -->
  <line x1="600" y1="85" x2="600" y2="74" stroke="#d4a039" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="584" y1="92" x2="576" y2="84" stroke="#d4a039" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="616" y1="92" x2="624" y2="84" stroke="#d4a039" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="580" y1="105" x2="569" y2="103" stroke="#d4a039" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="620" y1="105" x2="631" y2="103" stroke="#d4a039" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Light trail -->
  <path d="M600 119 L590 280" stroke="#d4a039" stroke-width="1" opacity="0.1" stroke-dasharray="4 5"/>

  <!-- Brand name -->
  <text x="600" y="420" text-anchor="middle" font-family="'Georgia', serif" font-size="72" font-weight="700" fill="#1a1a1a" letter-spacing="-2">
    <tspan>Lux</tspan><tspan fill="#d4a039">view</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="470" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#1a1a1a" opacity="0.5" letter-spacing="4">
    EXPERIENCIAS UNICAS ATRAVES DA TECNOLOGIA
  </text>

  <!-- Decorative line under tagline -->
  <line x1="460" y1="495" x2="740" y2="495" stroke="url(#blueGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Contact info area -->
  <text x="600" y="550" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1a1a1a" opacity="0.3" letter-spacing="2">
    TECNOLOGIA COM PROPOSITO
  </text>
</svg>
